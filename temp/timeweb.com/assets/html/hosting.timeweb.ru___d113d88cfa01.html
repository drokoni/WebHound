            (function() {
                function updateTheme() {
                    const theme = localStorage.getItem('data-theme');
                    if (theme === null) return;
                    
                    const baseBackground = theme === '"dark"' ? '#14161b' : '#f5f6f8';
                    
                    document.documentElement.style.setProperty('background-color', baseBackground, 'important');
                    if (document.body) {
                        document.body.style.setProperty('background-color', baseBackground, 'important');
                    }
                }
                
                updateTheme();
                
                new MutationObserver(updateTheme).observe(document.documentElement, {
                    attributes: true,
                    attributeFilter: ['data-theme']
                });
                
                const originalSetItem = localStorage.setItem;
                localStorage.setItem = function(key, value) {
                    originalSetItem.call(this, key, value);
                    if (key === 'data-theme') updateTheme();
                };
            })();
