[package]
name = "webhound"
version = "0.1.0"
edition = "2021"

[dependencies]
core = { path = "../core" }
scanner = { path = "../scanner" }
analyzer = { path = "../analyzer" }
server = { path = "../server" }
storage = { path = "../storage" }

serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
camino = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
url = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "cookies", "gzip", "brotli"] }
csv = "1"
